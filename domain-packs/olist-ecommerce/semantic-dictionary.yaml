domainId: "olist-ecommerce"
displayName: "Olist E-Commerce Analytics"
description: "Entrepôt analytique des commandes, paiements et livraisons e-commerce au Brésil."

tables:
  - name: "fact_orders"
    description: "Table centrale des commandes clients avec statuts, dates et montants payés."
    columns:
      - name: "order_id"
        dataType: "VARCHAR"
        description: "Identifiant unique de la commande."
      - name: "customer_id"
        dataType: "VARCHAR"
        description: "Identifiant du client."
      - name: "order_status"
        dataType: "VARCHAR"
        description: "Statut de la commande (delivered, canceled, shipped, processing)."
      - name: "purchase_timestamp"
        dataType: "TIMESTAMP"
        description: "Date et heure d'achat."
      - name: "delivered_customer_date"
        dataType: "TIMESTAMP"
        description: "Date effective de livraison au client."
      - name: "payment_value"
        dataType: "DOUBLE"
        description: "Montant total payé pour la commande."

metrics:
  - name: "GMV"
    displayName: "Gross Merchandise Value (Revenu Brut)"
    description: "Somme totale des paiements sur les commandes effectivement livrées (hors annulations)."
    sqlFormula: "SUM(payment_value)"
    requiredFilter: "order_status = 'delivered'"
  - name: "AOV"
    displayName: "Average Order Value (Panier Moyen)"
    description: "Revenu moyen par commande livrée."
    sqlFormula: "SUM(payment_value) / COUNT(DISTINCT order_id)"
    requiredFilter: "order_status = 'delivered'"