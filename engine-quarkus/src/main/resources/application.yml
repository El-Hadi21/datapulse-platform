quarkus:
  # Configuration du serveur HTTP
  http:
    port: 8080
  datasource:
    db-kind: postgresql
    username: ${DATAPULSE_DB_USER:datapulse_ro}
    password: ${DATAPULSE_DB_PASSWORD:datapulse_ro_pwd}
    jdbc:
      url: ${DATAPULSE_DB_URL:jdbc:postgresql://localhost:5432/datapulse}
    devservices:
      enabled: false
  log:
    level: INFO
    console:
      format: "%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n"
    category:
      "com.ilias.datapulse":
        level: DEBUG

datapulse:
  domain:
    pack-path: ../domain-packs/olist-ecommerce/semantic-dictionary.yaml